name: Lean build

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lake-build:
    name: lake build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (Lean toolchain manager)
        run: |
          base=https://github.com/leanprover/elan/releases/latest/download
          curl -sSfL "$base/elan-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lake build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake
          key: lake-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: lake-

      - name: Assert all packages share one Lean toolchain
        run: |
          toolchains="$(cat lean-toolchain generated/*/lean-toolchain \
            | sort -u | wc -l)"
          [ "$toolchains" -eq 1 ] || {
            echo "::error::packages disagree on lean-toolchain"
            exit 1
          }

      - name: Build all packages via the root package
        run: scripts/build-lean.sh
